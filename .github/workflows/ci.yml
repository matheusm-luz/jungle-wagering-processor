# The checks of `/verify`, on every push and pull request: the same scripts, the same Compose
# stack (real PostgreSQL and LocalStack), the same Bun as the Dockerfile.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test:unit

      # Each script builds the `test` image and runs the suite inside it, after PostgreSQL and
      # LocalStack report healthy (Compose `depends_on`).
      - run: bun run test:integration
      - run: bun run test:concurrency

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color postgres localstack

      - name: Stop the stack
        if: always()
        run: docker compose --profile test down --volumes
